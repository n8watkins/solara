# Every quality gate, in one reusable workflow.
# ci.yml runs it for pull requests and deploy.yml runs it before every production
# deploy, so each commit gets exactly one quality run per event.
#
# Change-aware: on a pull request, the `changes` job maps the files the pull
# request changes to the suites they can affect (.github/scripts/changed-areas.mjs).
# The `main` ruleset requires every job below to report, so no job is skipped at
# the job level: each one always starts, and a suite with nothing relevant to test
# skips its steps and passes with "No relevant changes" in its summary. Lint, the
# docs check, workflow and secret scanning and dependency review always run.
# Pushes to main and manual runs have no pull request base, so every suite runs,
# and so does every job if `changes` itself fails (its outputs are then empty).
name: Quality

on:
  workflow_call:

permissions: {}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      unit: ${{ steps.areas.outputs.unit }}
      unit_reason: ${{ steps.areas.outputs.unit_reason }}
      functions: ${{ steps.areas.outputs.functions }}
      functions_reason: ${{ steps.areas.outputs.functions_reason }}
      web: ${{ steps.areas.outputs.web }}
      web_reason: ${{ steps.areas.outputs.web_reason }}
      signed_in: ${{ steps.areas.outputs.signed_in }}
      signed_in_reason: ${{ steps.areas.outputs.signed_in_reason }}
      harness: ${{ steps.areas.outputs.harness }}
      harness_reason: ${{ steps.areas.outputs.harness_reason }}
      integrations: ${{ steps.areas.outputs.integrations }}
      integrations_reason: ${{ steps.areas.outputs.integrations_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff is taken from the merge base, so it needs the history.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Without a pull request (a push to main, a manual run) there is no base,
      # and every area runs.
      - name: Map changed files to suites
        id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            node .github/scripts/changed-areas.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            node .github/scripts/changed-areas.mjs
          fi

  web:
    name: Lint, types and unit tests
    needs: changes
    # Always report (required check), even if `changes` failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEVANT: ${{ needs.changes.outputs.unit != 'false' }}
      REASON: ${{ needs.changes.outputs.unit_reason }}
    steps:
      - name: Check for relevant changes
        run: |
          if [ "$RELEVANT" = true ]; then
            echo "Typecheck and unit tests run: $REASON."
          else
            echo "No relevant changes for the typecheck and unit tests: $REASON. Lint and the docs check still run." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # Dependency install scripts never run in CI (see SECURITY.md). The unit
      # tests also exercise the Functions code that shares @solara/core, so
      # functions/ is installed too.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix functions --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Docs links and paths
        run: npm run check:docs

      - name: Typecheck
        if: env.RELEVANT == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: env.RELEVANT == 'true'
        run: npm test

  e2e:
    name: Browser tests on the static export
    needs: changes
    # Always report (required check), even if `changes` failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEVANT: ${{ needs.changes.outputs.web != 'false' }}
      REASON: ${{ needs.changes.outputs.web_reason }}
    steps:
      - name: Check for relevant changes
        run: |
          if [ "$RELEVANT" = true ]; then
            echo "The browser tests on the static export run: $REASON."
          else
            echo "No relevant changes: $REASON." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RELEVANT == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RELEVANT == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # functions/ provides the locked firebase-tools that runs the Hosting emulator.
      - name: Install dependencies
        if: env.RELEVANT == 'true'
        run: |
          npm ci --ignore-scripts
          npm ci --prefix functions --ignore-scripts

      # Firefox and WebKit run only tests/e2e/microsoft-sign-in.spec.ts (playwright.config.ts):
      # each engine applies Solara's opener policy to the Outlook sign-in popup its own way.
      - name: Install Chromium, Firefox and WebKit
        if: env.RELEVANT == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # Builds out/ with a hermetic public env, then serves it on the Hosting emulator.
      - name: Browser tests
        if: env.RELEVANT == 'true'
        run: npm run test:e2e

      - name: Upload browser report
        if: failure() && env.RELEVANT == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e-integrations:
    name: Browser tests with Sentry and App Check switched on
    needs: changes
    # Always report (required check), even if `changes` failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEVANT: ${{ needs.changes.outputs.integrations != 'false' }}
      REASON: ${{ needs.changes.outputs.integrations_reason }}
    steps:
      - name: Check for relevant changes
        run: |
          if [ "$RELEVANT" = true ]; then
            echo "The Sentry and App Check browser tests run: $REASON."
          else
            echo "No relevant changes: $REASON." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RELEVANT == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RELEVANT == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # functions/ provides the locked firebase-tools that runs the Hosting emulator.
      - name: Install dependencies
        if: env.RELEVANT == 'true'
        run: |
          npm ci --ignore-scripts
          npm ci --prefix functions --ignore-scripts

      - name: Install Chromium
        if: env.RELEVANT == 'true'
        run: npx playwright install --with-deps chromium

      # A production build with a fake Sentry DSN and reCAPTCHA site key; fakes in
      # tests/e2e/integrations answer every third-party request.
      - name: Integration browser tests
        if: env.RELEVANT == 'true'
        run: npm run test:e2e:integrations

      - name: Upload traces and report
        if: failure() && env.RELEVANT == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrations-traces
          path: |
            test-results/integrations/artifacts/
            playwright-report/integrations/
          if-no-files-found: ignore
          retention-days: 7

  e2e-signed-in:
    name: Signed-in browser tests on emulators
    needs: changes
    # Always report (required check), even if `changes` failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RELEVANT: ${{ needs.changes.outputs.signed_in != 'false' }}
      REASON: ${{ needs.changes.outputs.signed_in_reason }}
    steps:
      - name: Check for relevant changes
        run: |
          if [ "$RELEVANT" = true ]; then
            echo "The signed-in browser tests run: $REASON."
          else
            echo "No relevant changes: $REASON." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RELEVANT == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RELEVANT == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.RELEVANT == 'true'
        with:
          distribution: temurin
          java-version: 21

      # functions/ provides the locked firebase-tools and the Functions under test.
      - name: Install dependencies
        if: env.RELEVANT == 'true'
        run: |
          npm ci --ignore-scripts
          npm ci --prefix functions --ignore-scripts

      - name: Install Chromium
        if: env.RELEVANT == 'true'
        run: npx playwright install --with-deps chromium

      # Builds an emulator-only export, then runs Playwright inside
      # `firebase emulators:exec` with Auth, Firestore and Functions on free ports.
      - name: Signed-in browser tests
        if: env.RELEVANT == 'true'
        run: npm run test:e2e:signed-in

      - name: Upload traces and report
        if: failure() && env.RELEVANT == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-in-traces
          path: |
            test-results/signed-in/artifacts/
            playwright-report/signed-in/
          if-no-files-found: ignore
          retention-days: 7

  ui-harness:
    name: Signed-in UI harness
    needs: changes
    # Always report (required check), even if `changes` failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEVANT: ${{ needs.changes.outputs.harness != 'false' }}
      REASON: ${{ needs.changes.outputs.harness_reason }}
    steps:
      - name: Check for relevant changes
        run: |
          if [ "$RELEVANT" = true ]; then
            echo "The UI harness tests run: $REASON."
          else
            echo "No relevant changes: $REASON." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RELEVANT == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RELEVANT == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: env.RELEVANT == 'true'
        run: npm ci --ignore-scripts

      - name: Install Chromium
        if: env.RELEVANT == 'true'
        run: npx playwright install --with-deps chromium

      # Writes screenshots and an axe report to test-results/ui-harness/. Axe
      # violations are reported, not failed; a broken screen still fails the job.
      - name: UI harness
        if: env.RELEVANT == 'true'
        run: npm run test:harness

      - name: Upload screenshots and axe report
        if: ${{ !cancelled() && env.RELEVANT == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-harness
          path: |
            test-results/ui-harness/
            !test-results/ui-harness/site/
          if-no-files-found: error
          retention-days: 14

  functions:
    name: Functions and Firestore rules
    needs: changes
    # Always report (required check), even if `changes` failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEVANT: ${{ needs.changes.outputs.functions != 'false' }}
      REASON: ${{ needs.changes.outputs.functions_reason }}
    steps:
      - name: Check for relevant changes
        run: |
          if [ "$RELEVANT" = true ]; then
            echo "The Functions and Firestore rules tests run: $REASON."
          else
            echo "No relevant changes: $REASON." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RELEVANT == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RELEVANT == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.RELEVANT == 'true'
        with:
          distribution: temurin
          java-version: 21

      # The root install provides the compiler for @solara/core, which the
      # Functions scripts build into functions/core (npm run build:core) before
      # compiling the Functions into functions/lib (npm run build).
      - name: Install dependencies
        if: env.RELEVANT == 'true'
        run: |
          npm ci --ignore-scripts
          npm ci --prefix functions --ignore-scripts

      - name: Audit Functions production dependencies
        if: env.RELEVANT == 'true'
        run: npm audit --prefix functions --omit=dev --audit-level=high

      - name: Typecheck Functions
        if: env.RELEVANT == 'true'
        run: npm run typecheck --prefix functions --if-present

      - name: Functions tests
        if: env.RELEVANT == 'true'
        run: npm test --prefix functions

      # Loads the compiled entry point (built by the tests above) and resolves its
      # params exactly as a non-interactive `firebase deploy --only functions` would.
      - name: Functions deploy params
        if: env.RELEVANT == 'true'
        run: node .github/scripts/check-functions-params.js uv-activity-planner

      # Packages functions/ the way `firebase deploy` does and loads it from a
      # clean copy, so the deployed source never depends on the workspace.
      - name: Functions deploy payload
        if: env.RELEVANT == 'true'
        run: node .github/scripts/check-functions-payload.js

      - name: Firestore rules tests
        if: env.RELEVANT == 'true'
        run: npm run test:rules --prefix functions

  supply-chain:
    name: Workflow and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans history (a PR's own commits, or all of main), not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install actionlint and gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C bin actionlint
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          # Findings show as annotations and fail the job. Uploading them to code
          # scanning (free now that the repository is public) would also need
          # security-events: write, which this job does not grant.
          advanced-security: false
          annotations: true

      # A pull request is checked for the commits it adds (base..head), so other
      # branches' history can never fail it; a push to main scans main's full
      # history. .gitleaksignore applies to both. The report is always redacted, and
      # a failure lists each finding (rule, file, commit) in the log.
      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range=HEAD
          fi
          report="$RUNNER_TEMP/gitleaks-report.json"
          echo "Scanning $range"
          if gitleaks git --redact --no-banner --exit-code 1 \
            --log-opts="$range" --report-format json --report-path "$report" .; then
            exit 0
          fi
          if [ -s "$report" ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::gitleaks \(.RuleID) in \(.File):\(.StartLine), commit \(.Commit)"' "$report"
          fi
          exit 1

      - name: Upload gitleaks report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Workflow script tests
        run: node --test '.github/scripts/*.test.mjs'

  dependency-review:
    name: Dependency review
    # Dependency review needs the dependency graph, which GitHub offers for public
    # repositories (this one since 2026-10-23) or with Advanced Security.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
