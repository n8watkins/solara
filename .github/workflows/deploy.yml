# Production deploy for every push to main.
#
# The static export is built once, smoke-tested on the Hosting emulator, packaged
# with its SHA-256 digest, SBOMs and a provenance record, and that exact artifact
# is what Hosting receives. Each Firebase target is its own job, so the run shows
# which one failed and a Firestore index failure does not hide a Hosting success.
#
# Credentials: Workload Identity Federation when the GCP_* repository variables
# are set (docs/WIF_SETUP.md), otherwise the FIREBASE_SERVICE_ACCOUNT key secret.
#
# Only main deploys. A manual run (workflow_dispatch) can pick any branch, so
# every job that receives credentials or a deploy token also checks the ref;
# on another branch only the quality checks run.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'uv-activity-planner' }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  build:
    name: Build production artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      site-sha256: ${{ steps.package.outputs.sha256 }}
    env:
      # Public values compiled into the bundle. They belong in repository
      # variables; the secrets fallback keeps deploys working until they move.
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY || secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
      NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY || secrets.NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY }}
      NEXT_PUBLIC_FIREBASE_APP_CHECK_PROVIDER: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_CHECK_PROVIDER }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID || secrets.NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      # Error reporting (D10) stays off, with no Sentry code in the bundle, until the
      # DSN variable is set. Each deploy is its own Sentry release.
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ vars.NEXT_PUBLIC_SENTRY_DSN && github.sha || '' }}
      # Function-backed surfaces stay off unless Functions are deployed.
      NEXT_PUBLIC_FUNCTIONS_URL: ${{ vars.ENABLE_BLAZE_FUNCTIONS == 'true' && (vars.NEXT_PUBLIC_FUNCTIONS_URL || secrets.NEXT_PUBLIC_FUNCTIONS_URL) || '' }}
      ENABLE_BLAZE_FUNCTIONS: ${{ vars.ENABLE_BLAZE_FUNCTIONS }}
      # Pro checkout replaces the waitlist only when the owner switches billing on, and
      # only together with the Functions.
      NEXT_PUBLIC_BILLING_ENABLED: ${{ vars.ENABLE_BLAZE_FUNCTIONS == 'true' && vars.BILLING_ENABLED == 'true' && '1' || '' }}
      # Forecasts come through the commercial-licence proxy only once the owner switches
      # it on; until then the browser calls Open-Meteo directly.
      NEXT_PUBLIC_FORECAST_PROXY: ${{ vars.ENABLE_BLAZE_FUNCTIONS == 'true' && vars.FORECAST_PROXY_ENABLED == 'true' && '1' || '' }}
      # Settings offers Pro morning and UV alerts only once the owner switches them on,
      # and only together with the Functions that send them.
      NEXT_PUBLIC_ALERTS_ENABLED: ${{ vars.ENABLE_BLAZE_FUNCTIONS == 'true' && vars.ALERTS_ENABLED == 'true' && '1' || '' }}
      # The Events section offers linked calendars (and Settings the Pro event heads-up)
      # only once the owner switches them on, and only together with the Functions.
      NEXT_PUBLIC_EVENTS_SUBSCRIPTIONS_ENABLED: ${{ vars.ENABLE_BLAZE_FUNCTIONS == 'true' && vars.EVENTS_SUBSCRIPTIONS_ENABLED == 'true' && '1' || '' }}
      # The Events section shows events already in Google Calendar only once the owner
      # switches it on, after Google verifies the read-only scope; it needs no Functions,
      # only the OAuth client ID above.
      NEXT_PUBLIC_GOOGLE_CALENDAR_EVENTS_ENABLED: ${{ vars.GOOGLE_CALENDAR_EVENTS_ENABLED == 'true' && '1' || '' }}
      # Events already in Outlook (docs/integrations/OUTLOOK.md): the Azure app's public
      # client ID (a public client has no secret), and the switch the owner sets once a
      # controlled account has been checked; no Functions needed.
      NEXT_PUBLIC_MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
      NEXT_PUBLIC_OUTLOOK_CALENDAR_EVENTS_ENABLED: ${{ vars.OUTLOOK_CALENDAR_EVENTS_ENABLED == 'true' && '1' || '' }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # The deployed artifact is built without a restored dependency cache.
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix functions --ignore-scripts

      - name: Check the public build configuration
        run: node .github/scripts/check-public-env.mjs

      # Source maps are built only when they can go to Sentry: a DSN, the
      # SENTRY_ORG and SENTRY_PROJECT variables and the SENTRY_AUTH_TOKEN secret.
      - name: Decide whether to upload source maps to Sentry
        env:
          HAS_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -n "$NEXT_PUBLIC_SENTRY_DSN" ] && [ "$HAS_SENTRY_TOKEN" = "true" ] \
            && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            echo "BROWSER_SOURCE_MAPS=1" >> "$GITHUB_ENV"
            echo "Source maps will be uploaded to Sentry and removed from the artifact."
          else
            echo "Source maps are off: Sentry upload is not configured."
          fi

      - name: Build the static export
        run: npm run build

      # Debug ids tie each published script to its uploaded map, so Sentry can
      # show original source without the maps ever being served.
      - name: Upload source maps to Sentry
        if: env.BROWSER_SOURCE_MAPS == '1'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          node_modules/.bin/sentry-cli sourcemaps inject out/_next/static
          node_modules/.bin/sentry-cli sourcemaps upload --release "$NEXT_PUBLIC_SENTRY_RELEASE" out/_next/static

      - name: Remove source maps from the artifact
        if: env.BROWSER_SOURCE_MAPS == '1'
        run: node .github/scripts/remove-source-maps.mjs out

      # Also fails on any source map left in the export, and on Sentry code in a
      # build without a DSN.
      - name: Check the configuration compiled into the export
        run: node .github/scripts/check-public-env.mjs --built out

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The exact files that will be deployed, served with the real firebase.json.
      - name: Smoke-test the artifact on the Hosting emulator
        run: npx playwright test --grep @smoke
        env:
          E2E_SITE_DIR: out

      - name: Package the artifact with SBOMs and provenance
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          # Deterministic archive: sorted entries, fixed owners and timestamps.
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf dist/site.tar.gz -C out .
          sha256=$(sha256sum dist/site.tar.gz | cut -d' ' -f1)
          .github/scripts/sbom.sh . dist/sbom-web.cdx.json
          .github/scripts/sbom.sh functions dist/sbom-functions.cdx.json
          jq -n \
            --arg sha256 "$sha256" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --arg node "$(node --version)" \
            --arg project "$FIREBASE_PROJECT_ID" \
            '{subject: {name: "site.tar.gz", sha256: $sha256}, repository: $repository,
              commit: $commit, ref: $ref, workflow: $workflow, run: $run,
              node: $node, firebaseProject: $project}' > dist/provenance.json
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### Production artifact"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- \`site.tar.gz\` SHA-256: \`$sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-site
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the smoke-test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  attest:
    name: Attest build provenance
    # Artifact attestations need a public repository (or GitHub Enterprise Cloud).
    # Until then dist/provenance.json and the job summary record the digest.
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-site
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/site.tar.gz

  firestore-rules:
    name: Firestore rules
    if: github.ref == 'refs/heads/main'
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/firebase-cli
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          credentials-json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        run: functions/node_modules/.bin/firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive

  firestore-indexes:
    name: Firestore indexes
    if: github.ref == 'refs/heads/main'
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/firebase-cli
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          credentials-json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore indexes
        run: |
          if ! functions/node_modules/.bin/firebase deploy --only firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive; then
            echo "::error::Firestore indexes were not deployed. The deploy identity needs roles/datastore.indexAdmin (owner decision D3). Hosting is deployed by its own job."
            exit 1
          fi

  functions:
    name: Cloud Functions
    if: github.ref == 'refs/heads/main' && vars.ENABLE_BLAZE_FUNCTIONS == 'true'
    # Functions query the declared indexes and rely on the final rules.
    needs: [quality, build, firestore-rules, firestore-indexes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/firebase-cli
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          credentials-json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # functions/.env holds the committed defaults. The Pro prices, the billing, alerts and
      # events switches, the alerts' and the budget kill switch's runtime identities and the
      # budget's id are per project. Detaching billing (the kill switch's hard stop) is on
      # unless the COST_GUARD_DETACH_BILLING repository variable is false.
      - name: Write project-specific Functions params
        env:
          STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID || secrets.STRIPE_PRICE_ID }}
          STRIPE_YEARLY_PRICE_ID: ${{ vars.STRIPE_YEARLY_PRICE_ID }}
          BILLING_ENABLED: ${{ vars.BILLING_ENABLED == 'true' && 'true' || 'false' }}
          FORECAST_PROXY_ENABLED: ${{ vars.FORECAST_PROXY_ENABLED == 'true' && 'true' || 'false' }}
          COST_GUARD_DETACH_BILLING: ${{ vars.COST_GUARD_DETACH_BILLING == 'false' && 'false' || 'true' }}
          BUDGET_ID: ${{ vars.BUDGET_ID }}
          BUDGET_SERVICE_ACCOUNT: ${{ vars.BUDGET_SERVICE_ACCOUNT }}
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED == 'true' && 'true' || 'false' }}
          ALERTS_SERVICE_ACCOUNT: ${{ vars.ALERTS_SERVICE_ACCOUNT }}
          EVENTS_SUBSCRIPTIONS_ENABLED: ${{ vars.EVENTS_SUBSCRIPTIONS_ENABLED == 'true' && 'true' || 'false' }}
          GOOGLE_CALENDAR_EVENTS_ENABLED: ${{ vars.GOOGLE_CALENDAR_EVENTS_ENABLED == 'true' && 'true' || 'false' }}
          OUTLOOK_CALENDAR_EVENTS_ENABLED: ${{ vars.OUTLOOK_CALENDAR_EVENTS_ENABLED == 'true' && 'true' || 'false' }}
        run: |
          if [ "$BILLING_ENABLED" = true ] && { [ -z "$STRIPE_PRICE_ID" ] || [ -z "$STRIPE_YEARLY_PRICE_ID" ]; }; then
            echo "::error::Set the STRIPE_PRICE_ID and STRIPE_YEARLY_PRICE_ID repository variables before switching billing on."
            exit 1
          fi
          if [ "$COST_GUARD_DETACH_BILLING" = true ] && [ -z "$BUDGET_SERVICE_ACCOUNT" ]; then
            echo "::warning::The budget kill switch cannot detach billing until infra/budget.sh has run and the BUDGET_SERVICE_ACCOUNT repository variable is set (docs/RUNBOOK.md, Budget kill switch)."
          fi
          if [ -z "$BUDGET_ID" ]; then
            echo "::warning::Set the BUDGET_ID repository variable so the budget kill switch acts only on Solara's budget (infra/budget.sh prints it)."
          fi
          {
            printf 'STRIPE_PRICE_ID=%s\n' "$STRIPE_PRICE_ID"
            printf 'STRIPE_YEARLY_PRICE_ID=%s\n' "$STRIPE_YEARLY_PRICE_ID"
            printf 'BILLING_ENABLED=%s\n' "$BILLING_ENABLED"
            printf 'FORECAST_PROXY_ENABLED=%s\n' "$FORECAST_PROXY_ENABLED"
            printf 'COST_GUARD_DETACH_BILLING=%s\n' "$COST_GUARD_DETACH_BILLING"
            printf 'BUDGET_ID=%s\n' "$BUDGET_ID"
            printf 'BUDGET_SERVICE_ACCOUNT=%s\n' "$BUDGET_SERVICE_ACCOUNT"
            printf 'ALERTS_ENABLED=%s\n' "$ALERTS_ENABLED"
            printf 'ALERTS_SERVICE_ACCOUNT=%s\n' "$ALERTS_SERVICE_ACCOUNT"
            printf 'EVENTS_SUBSCRIPTIONS_ENABLED=%s\n' "$EVENTS_SUBSCRIPTIONS_ENABLED"
            printf 'GOOGLE_CALENDAR_EVENTS_ENABLED=%s\n' "$GOOGLE_CALENDAR_EVENTS_ENABLED"
            printf 'OUTLOOK_CALENDAR_EVENTS_ENABLED=%s\n' "$OUTLOOK_CALENDAR_EVENTS_ENABLED"
          } > "functions/.env.$FIREBASE_PROJECT_ID"

      # The deploy uploads compiled code: @solara/core in functions/core and the
      # Functions TypeScript in functions/lib, both inside the uploaded source.
      # The predeploy hook in firebase.json rebuilds them; building here lets the
      # checks below load the exact source the deploy uploads.
      - name: Build the Functions
        run: |
          npm ci --ignore-scripts
          npm run build --prefix functions

      - name: Check Functions params
        run: node .github/scripts/check-functions-params.js "$FIREBASE_PROJECT_ID"

      - name: Check the Functions deploy payload
        run: node .github/scripts/check-functions-payload.js

      # --force: the committed source is the truth, so functions removed from it are
      # deleted, and a missing Artifact Registry cleanup policy for the Functions' images
      # is created (keep 1 day; infra/backups.sh) instead of failing the deploy.
      - name: Deploy Functions
        run: functions/node_modules/.bin/firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive --force

  hosting:
    name: Hosting
    # Waits for Functions only when they deploy: without Functions, a failed index
    # job never blocks the static site; with them, the bundle that calls them
    # ships only after they deploy.
    needs: [quality, build, firestore-rules, functions]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.quality.result == 'success'
      && needs.build.result == 'success'
      && needs.firestore-rules.result == 'success'
      && (needs.functions.result == 'success'
        || (vars.ENABLE_BLAZE_FUNCTIONS != 'true' && needs.functions.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-site
          path: ${{ runner.temp }}/dist

      - name: Verify and unpack the tested artifact
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.site-sha256 }}
          DIST: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          echo "${EXPECTED_SHA256}  $DIST/site.tar.gz" | sha256sum --check --strict
          mkdir out
          tar -xzf "$DIST/site.tar.gz" -C out

      - uses: ./.github/actions/firebase-cli
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          credentials-json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Hosting
        env:
          SITE_SHA256: ${{ needs.build.outputs.site-sha256 }}
        run: |
          functions/node_modules/.bin/firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive \
            --message "$GITHUB_SHA (site.tar.gz sha256 $SITE_SHA256)"
          echo "Deployed commit \`$GITHUB_SHA\` to Hosting (\`$SITE_SHA256\`)." >> "$GITHUB_STEP_SUMMARY"
