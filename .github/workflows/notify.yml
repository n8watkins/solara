name: Send morning notifications

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build & log messages without sending any push"
        type: boolean
        default: true
      force_send:
        description: "Ignore local-time eligibility while preserving idempotency"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: solara-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache in a job that holds cloud credentials.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The notifier has its own identity, separate from the deploy identity
      # (docs/WIF_SETUP.md). Without it, the shared key secret is still used.
      - name: Authenticate with Workload Identity Federation
        if: vars.GCP_NOTIFIER_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_NOTIFIER_SERVICE_ACCOUNT }}

      - name: Send notifications
        run: node scripts/send-notifications.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ vars.GCP_NOTIFIER_SERVICE_ACCOUNT == '' && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE_SEND: ${{ inputs.force_send && '1' || '0' }}
