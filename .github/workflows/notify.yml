name: Send morning notifications

on:
  schedule:
    - cron: '0 13 * * *'  # 6am PDT (UTC-7), adjust for daylight saving
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & log messages without sending any push'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Send notifications
        run: node scripts/send-notifications.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEXT_PUBLIC_SITE_URL:     ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          DRY_RUN:                  ${{ inputs.dry_run && '1' || '0' }}
