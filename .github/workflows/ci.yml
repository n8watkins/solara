# Quality checks for pull requests. Pushes to main run the same reusable
# quality workflow inside deploy.yml, so every event gets exactly one run.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
