# Dependabot version updates. Security updates follow the repository's
# Dependabot security settings (see SECURITY.md).
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let new releases age a week before proposing them (supply-chain cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node type definitions must match the Node 24 runtime (.nvmrc, the root and
      # Functions engines "24"). Move this when the runtime moves.
      - dependency-name: '@types/node'
        versions: ['>=25']

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      functions-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node type definitions must match the Node 24 runtime (.nvmrc, the root and
      # Functions engines "24"). Move this when the runtime moves.
      - dependency-name: '@types/node'
        versions: ['>=25']

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
